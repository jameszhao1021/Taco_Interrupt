<body>

  <main

    <div class="main-taco">
      🌮

      id="sender"

    >

    <div

    </div>

  </div>


  <script>

    /*
     * =========================================
     * SUPABASE CONFIGURATION
     * =========================================
     */

    const SUPABASE_URL =
      "https://fjjpprbooqdrcdcbgrjn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_k7ATPOqoO1xd0dFCAMdwcg_hsSx4wAd";

    const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    /*
     * =========================================
     * LOAD LATEST TACO EVENT
     * =========================================
     */

    async function loadLatestTaco() {

      try {

        const endpoint =
          `${SUPABASE_URL}/rest/v1/taco_events` +
          `?select=sender,receivers,text,created_at` +
          `&order=created_at.desc` +
          `&limit=1`;


        const response = await fetch(
          endpoint,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_PUBLISHABLE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
            },

            cache: "no-store"
          }
        );


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(
            `Supabase ${response.status}: ${errorText}`
          );

        }


        const rows =
          await response.json();


        if (
          !Array.isArray(rows) ||
          rows.length === 0
        ) {

          throw new Error(
            "No Taco event found"
          );

        }


        const taco =
          rows[0];


        renderTaco(taco);

      }

      catch (error) {

        console.error(
          "Failed to load Taco event:",
          error
        );

        showError();

      }

    }
     
    function subscribeToTacoEvents() {

  supabaseClient
    .channel("taco-events")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "taco_events"
      },
      (payload) => {

        console.log(
          "New Taco received:",
          payload.new
        );

        renderTaco(payload.new);
      }
    )
    .subscribe((status) => {

      console.log(
        "Realtime status:",
        status
      );

    });
}

    /*
     * =========================================
     * RENDER TACO
     * =========================================
     */

    function renderTaco(data) {

      /*
       * Sender
       */

      const sender =
        typeof data.sender === "string"
          ? data.sender
          : "";


      /*
       * Receivers
       */

      const receivers =
        Array.isArray(data.receivers)
          ? data.receivers
          : [];


      /*
       * Text
       *
       * Convert :taco: to 🌮
       */

      let text =
        typeof data.text === "string"
          ? data.text
          : "";


      text =
        text.replace(
          /:taco:/gi,
          "🌮"
        );


      /*
       * Update UI
       */

      document
        .getElementById("sender")
        .textContent =
        sender;


      document
        .getElementById("receivers")
        .textContent =
        receivers.join("  •  ");


      document
        .getElementById("text")
        .textContent =
        text;


      /*
       * Show app
       */

      document
        .getElementById("app")
        .style.display =
        "block";


      document
        .getElementById("error")
        .style.display =
        "none";

    }


    /*
     * =========================================
     * ERROR
     * =========================================
     */

    function showError() {

      document
        .getElementById("app")
        .style.display =
        "none";


      document
        .getElementById("error")
        .style.display =
        "block";

    }


    /*
     * =========================================
     * START
     * =========================================
     */

    loadLatestTaco();
subscribeToTacoEvents();
  </script>

</body>
